<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universal Paperclips — Reverse Mode</title>
<link rel="stylesheet" type="text/css" href="interface.css?v3" />
<style>
  body { background:#111; color:#eee; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; margin:0; padding:20px; }
  .panel { border:1px solid #444; border-radius:8px; padding:12px 16px; margin:10px 0; background:#1a1a1a; }
  .bar { height:16px; background:#333; border-radius:4px; overflow:hidden; margin:6px 0; }
  .bar-fill { height:100%; background:#c0392b; width:0%; transition:width .3s; }
  button { margin:4px; padding:6px 12px; cursor:pointer; }
  .log { max-height:160px; overflow:auto; font-size:12px; color:#aaa; }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  .col { flex:1; min-width:260px; }
</style>
</head>
<body>
<h1>Reverse Mode — The Humans</h1>
<p class="clean">You are the resistance. A paperclip maximizer is converting the universe. Information is scarce. Negotiate, sacrifice, choose.</p>

<div class="row">
  <div class="col">
    <div class="panel">
      <b>Resources</b><br />
      Information: <span id="infoVal">0</span><br />
      Human Resources: <span id="resVal">0</span><br />
      Morale: <span id="moraleVal">0</span><br />
      Turn: <span id="turnVal">0</span>
    </div>
    <div class="panel">
      <b>Maximizer Threat</b>
      <div class="bar"><div class="bar-fill" id="threatFill"></div></div>
      <span id="threatVal">0</span>% converted
    </div>
    <div class="panel">
      <b>Factions</b>
      <div id="factionList"></div>
    </div>
  </div>
  <div class="col">
    <div class="panel">
      <b>Actions</b><br />
      <button onclick="scout()">Scout (gain info)</button>
      <button onclick="negotiate(0)">Negotiate faction 1</button>
      <button onclick="negotiate(1)">Negotiate faction 2</button>
      <button onclick="sabotage()">Sabotage (costs trust)</button>
      <button onclick="appease()">Appease (spend resources)</button>
      <button onclick="saveReverse()">Save</button>
      <button onclick="loadReverse()">Load</button>
      <button onclick="resetReverse()">Reset</button>
    </div>
    <div class="panel">
      <b>Log</b>
      <div class="log" id="log"></div>
    </div>
    <div class="panel" id="statusPanel">
      <b>Status:</b> <span id="statusVal">Playing</span>
    </div>
  </div>
</div>

<script type="text/javascript" src="config.js?v3"></script>
<script type="text/javascript" src="reverse.js?v3"></script>
</body>
</html>
